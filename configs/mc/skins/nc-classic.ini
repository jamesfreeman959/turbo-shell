[skin]
    description = Norton Commander classic (256-color, terminal-theme-safe)
    # Uses 256-color indices 16+ which are NOT remapped by terminal palettes,
    # so the colours are reliable regardless of the terminal theme.
    #   color19  = #0000af — deep navy, matches IBM PC 'dark blue' (NC panels)
    #   color231 = #ffffff — pure white text
    #   color37  = #00afaf — dark teal, matches IBM PC 'dark cyan' (selection bar)
    #   color226 = #ffff00 — yellow (marked files)
    #   color16  = #000000 — black

[Lines]
    horiz = ─
    vert = │
    lefttop = ┌
    righttop = ┐
    leftbottom = └
    rightbottom = ┘
    topmiddle = ┬
    bottommiddle = ┴
    leftmiddle = ├
    rightmiddle = ┤
    cross = ┼
    dhoriz = ─
    dvert = │
    dlefttop = ┌
    drighttop = ┐
    dleftbottom = └
    drightbottom = ┘
    dtopmiddle = ┬
    dbottommiddle = ┴
    dleftmiddle = ├
    drightmiddle = ┤

[core]
    _default_ = color231;color19
    selected = color16;color37
    marked = color226;color19
    markselect = color226;color37
    gauge = color231;color16
    input = color16;color37
    inputunchanged = color16;color37
    inputmark = color37;color16
    disabled = color8;color7
    reverse = color16;color7
    commandlinemark = color16;color7
    header = color226;color19
    shadow = color8;color16

[dialog]
    _default_ = black;lightgray
    dfocus = black;cyan
    dhotnormal = blue;lightgray
    dhotfocus = blue;cyan
    dtitle = blue;lightgray

[error]
    _default_ = color231;color1
    errdhotnormal = color226;color1
    errdhotfocus = color226;lightgray
    errdtitle = color226;color1

[filehighlight]
    directory = color231;
    executable = color10;
    symlink = color14;
    stalelink = color9;
    device = color13;
    special = color8;

[menu]
    _default_ = color16;color37
    menusel = color231;color16
    menuhot = color226;color37
    menuhotsel = color226;color16
    menuinactive = color8;color37

[popupmenu]
    _default_ = color231;color37
    menusel = color226;color16
    menutitle = color226;color37

[buttonbar]
    hotkey = color231;color16
    button = color16;color37

[statusbar]
    _default_ = color16;color37

[help]
    _default_ = black;lightgray
    helpitalic = red;lightgray
    helpbold = blue;lightgray
    helplink = black;cyan
    helpslink = color226;color19
    helptitle = blue;lightgray

[editor]
    _default_ = color231;color19
    editbold = color226;
    editmarked = color16;color37
    editwhitespace = color20;color19
    editnonprintable = ;color16
    editlinestate = color231;color37
    bookmark = color231;color1
    bookmarkfound = color16;color2
    editframeactive = color231;
    editframedrag = color37;

[viewer]
    _default_ = color231;color19
    viewbold = color226;color19
    viewunderline = color9;color19
    viewselected = color226;color37

[diffviewer]
    added = color231;color2
    changedline = color4;color37
    changednew = color1;color37
    changed = color231;color37
    removed = color231;color1
    error = color1;lightgray

[widget-panel]
    sort-up-char = '
    sort-down-char = .
    filename-scroll-left-char = {
    filename-scroll-right-char = }

[widget-editor]
    window-state-char = *
    window-close-char = X
